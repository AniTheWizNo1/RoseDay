<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Rose Day Vansh ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #fff5f7 50%, #ffe9f3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background particles */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, rgba(214, 51, 132, 0.4), transparent);
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100px) translateX(var(--tx)) scale(1);
                opacity: 0;
            }
        }

        /* Glass morphism card */
        .container {
            text-align: center;
            z-index: 5;
            padding: 3rem 2.5rem;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 8px 32px rgba(214, 51, 132, 0.15),
                0 0 80px rgba(255, 182, 193, 0.3),
                inset 0 0 60px rgba(255, 255, 255, 0.1);
            animation: cardEntrance 1s ease-out;
            position: relative;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Decorative corner accents */
        .container::before,
        .container::after {
            content: '✦';
            position: absolute;
            font-size: 1.5rem;
            color: rgba(214, 51, 132, 0.3);
            animation: sparkle 3s ease-in-out infinite;
        }

        .container::before {
            top: 20px;
            left: 20px;
        }

        .container::after {
            bottom: 20px;
            right: 20px;
            animation-delay: 1.5s;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.2);
            }
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 4rem;
            background: linear-gradient(135deg, #d63384 0%, #e91e63 50%, #ff6b9d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            font-weight: 600;
            letter-spacing: 3px;
            animation: fadeInDown 1s ease-out;
            text-shadow: 0 2px 20px rgba(214, 51, 132, 0.2);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d63384, transparent);
            margin: 1.5rem auto;
            animation: fadeIn 1.5s ease-in;
        }

        .message {
            font-size: 1.2rem;
            color: #8b4566;
            margin-bottom: 2.5rem;
            line-height: 2;
            font-weight: 300;
            animation: fadeIn 1.8s ease-in;
            letter-spacing: 0.5px;
        }

        .rose-container {
            position: relative;
            display: inline-block;
            margin: 2rem 0;
        }

        .rose-display {
            font-size: 7rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            animation: float 3s ease-in-out infinite;
            display: inline-block;
            filter: drop-shadow(0 10px 20px rgba(214, 51, 132, 0.3));
            position: relative;
            z-index: 2;
        }

        .rose-display:hover {
            transform: scale(1.15) rotate(10deg);
            filter: drop-shadow(0 15px 30px rgba(214, 51, 132, 0.5));
        }

        .rose-display:active {
            transform: scale(1.05) rotate(-5deg);
        }

        /* Glow effect behind rose */
        .rose-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(233, 30, 99, 0.3), transparent 70%);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 0.8;
            }
        }

        .rose {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            z-index: 15;
            animation: fall linear forwards;
            opacity: 0;
            filter: drop-shadow(0 2px 4px rgba(214, 51, 132, 0.3));
        }

        @keyframes fall {
            0% {
                opacity: 1;
                transform: translateY(-100px) rotate(0deg) scale(0.5);
            }
            10% {
                opacity: 1;
                transform: translateY(0) rotate(36deg) scale(1);
            }
            100% {
                opacity: 0.2;
                transform: translateY(100vh) rotate(360deg) scale(0.8);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-15px) rotate(-5deg);
            }
            75% {
                transform: translateY(-10px) rotate(5deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            font-size: 1rem;
            color: #b85c7a;
            margin-top: 2rem;
            opacity: 0.9;
            animation: fadeIn 2.5s ease-in;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* Click hint */
        .hint {
            font-size: 0.85rem;
            color: rgba(214, 51, 132, 0.6);
            margin-top: 0.5rem;
            animation: fadeIn 3s ease-in, bounce 2s ease-in-out 3s infinite;
            font-style: italic;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        /* Heart particles on interaction */
        .heart-particle {
            position: fixed;
            font-size: 1rem;
            pointer-events: none;
            z-index: 100;
            animation: heartFloat 1.5s ease-out forwards;
        }

        @keyframes heartFloat {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.2);
            }
        }

        /* Roaming rose for gamified interaction */
        .roaming-rose {
            position: fixed;
            font-size: 3.5rem;
            cursor: pointer;
            z-index: 20;
            filter: drop-shadow(0 5px 15px rgba(214, 51, 132, 0.5));
            transition: transform 0.3s ease;
            animation: roamFloat 2s ease-in-out infinite;
        }

        .roaming-rose:hover {
            transform: scale(1.3) rotate(15deg);
            filter: drop-shadow(0 8px 25px rgba(214, 51, 132, 0.7));
        }

        .roaming-rose:active {
            transform: scale(1.1) rotate(-10deg);
        }

        @keyframes roamFloat {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-15px) rotate(10deg);
            }
        }

        /* Click counter */
        .click-counter {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 1rem 1.5rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #d63384;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 400;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.2);
            animation: fadeIn 1s ease-in;
        }

        .click-counter .count {
            font-size: 1.8rem;
            font-weight: 600;
            display: block;
            background: linear-gradient(135deg, #d63384 0%, #e91e63 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @media (max-width: 768px) {
            .container {
                padding: 2.5rem 2rem;
                margin: 1rem;
            }

            h1 {
                font-size: 2.8rem;
                letter-spacing: 2px;
            }
            
            .message {
                font-size: 1.1rem;
            }
            
            .rose-display {
                font-size: 5rem;
            }

            .button {
                padding: 1rem 2.5rem;
                font-size: 0.85rem;
            }

            .roaming-rose {
                font-size: 2.8rem;
            }

            .click-counter {
                top: 20px;
                right: 20px;
                padding: 0.8rem 1.2rem;
                font-size: 0.8rem;
            }

            .click-counter .count {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Click counter -->
    <div class="click-counter">
        <span class="count" id="clickCount">0</span>
        <div>Roses Caught</div>
    </div>

    <!-- Roaming rose -->
    <div class="roaming-rose" id="roamingRose" onclick="catchRose(event)">🌹</div>

    <div class="container">
        <h1>Happy Rose Day Vansh</h1>
        <div class="divider"></div>
        <p class="message">Every rose whispers a story of love, and Bangalore is not stopping me to create those with you</p>
        
        <div class="rose-container">
            <div class="rose-glow"></div>
            <div class="rose-display" onclick="createRose(); createHearts(event)" title="Click me!">🌹</div>
        </div>
        
        <p class="hint">Catch the roaming rose! ✨</p>
        
        <p class="subtitle">With all my love ❤️, your Awara</p>
    </div>

    <script>
        const roseEmojis = ['🌹', '🌺', '🌸', '💐', '💕'];
        let showerInterval;
        let particleInterval;
        let clickCount = 0;
        let roamingRose = document.getElementById('roamingRose');
        let isRoaming = true;

        // Make the rose roam randomly across the screen
        function moveRoamingRose() {
            if (!isRoaming) return;
            
            const maxX = window.innerWidth - 100;
            const maxY = window.innerHeight - 100;
            
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;
            
            roamingRose.style.transition = 'all 1.7s cubic-bezier(0.4, 0, 0.2, 1)';
            roamingRose.style.left = newX + 'px';
            roamingRose.style.top = newY + 'px';
            
            // Move to a new position every 1.7-3.4 seconds (15% faster)
            setTimeout(moveRoamingRose, Math.random() * 1700 + 1700);
        }

        // When the roaming rose is clicked
        function catchRose(event) {
            event.stopPropagation();
            clickCount++;
            document.getElementById('clickCount').textContent = clickCount;
            
            // Create celebration hearts
            createHearts(event);
            
            // Trigger rose shower
            startRoseShower();
            
            // Temporarily hide and reposition the roaming rose
            roamingRose.style.opacity = '0';
            roamingRose.style.transform = 'scale(0)';
            
            setTimeout(() => {
                const newX = Math.random() * (window.innerWidth - 100);
                const newY = Math.random() * (window.innerHeight - 100);
                roamingRose.style.transition = 'none';
                roamingRose.style.left = newX + 'px';
                roamingRose.style.top = newY + 'px';
                
                setTimeout(() => {
                    roamingRose.style.transition = 'all 0.5s ease';
                    roamingRose.style.opacity = '1';
                    roamingRose.style.transform = 'scale(1)';
                }, 50);
            }, 500);
        }

        // Create floating background particles
        function createBackgroundParticles() {
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * window.innerWidth + 'px';
                    particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
                    particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                    particle.style.animationDelay = Math.random() * 5 + 's';
                    document.body.appendChild(particle);
                }, i * 100);
            }
        }

        function createRose() {
            const rose = document.createElement('div');
            rose.className = 'rose';
            rose.textContent = roseEmojis[Math.floor(Math.random() * roseEmojis.length)];
            rose.style.left = Math.random() * window.innerWidth + 'px';
            const duration = Math.random() * 2 + 4;
            rose.style.animationDuration = duration + 's';
            
            document.body.appendChild(rose);
            
            setTimeout(() => {
                rose.remove();
            }, duration * 1000);
        }

        function createHearts(event) {
            const hearts = ['💕', '💖', '💗', '💝', '✨'];
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart-particle';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = event.clientX + (Math.random() - 0.5) * 80 + 'px';
                    heart.style.top = event.clientY + (Math.random() - 0.5) * 30 + 'px';
                    document.body.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 1500);
                }, i * 50);
            }
        }

        function startRoseShower() {
            // Create initial burst
            for (let i = 0; i < 35; i++) {
                setTimeout(() => createRose(), i * 80);
            }
            
            // Continue shower
            let count = 0;
            if (showerInterval) clearInterval(showerInterval);
            
            showerInterval = setInterval(() => {
                createRose();
                if (Math.random() > 0.6) createRose();
                count++;
                if (count > 70) {
                    clearInterval(showerInterval);
                }
            }, 180);
        }

        // Create ambient roses periodically
        setInterval(() => {
            if (Math.random() > 0.8) {
                createRose();
            }
        }, 2500);

        // Initialize
        window.addEventListener('load', () => {
            createBackgroundParticles();
            // Position roaming rose randomly at start
            roamingRose.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            roamingRose.style.top = Math.random() * (window.innerHeight - 100) + 'px';
            // Start roaming after a short delay
            setTimeout(moveRoamingRose, 1000);
        });

        // Reposition roaming rose on window resize
        window.addEventListener('resize', () => {
            const maxX = window.innerWidth - 100;
            const maxY = window.innerHeight - 100;
            const currentX = parseInt(roamingRose.style.left) || 0;
            const currentY = parseInt(roamingRose.style.top) || 0;
            
            roamingRose.style.left = Math.min(currentX, maxX) + 'px';
            roamingRose.style.top = Math.min(currentY, maxY) + 'px';
        });
    </script>
</body>
</html>
